name: CI Checks

on:
  push:
    branches-ignore: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: TypeCheck & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Compiler Check
        run: npx tsc --noEmit

      - name: Check bank guides
        run: npx --yes tsx src/content/bankGuides.test.ts

      - name: Check site copy
        run: npx --yes tsx src/content/site/site.test.ts

      - name: Build website
        run: npx --yes tsx scripts/build-site.ts