name: Website

on:
  push:
    branches: [ main ]
    paths:
      - 'src/content/**'
      - 'src/i18n/**'
      - 'src/utils/bankFormats.ts'
      - 'scripts/build-site.ts'
      - 'scripts/site/**'
      - 'site/**'
      - 'assets/images/icon.png'
      - 'assets/images/favicon.png'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check guides
        run: npx --yes tsx src/content/bankGuides.test.ts

      - name: Check site copy
        run: |
          npx --yes tsx src/content/site/site.test.ts
          npx --yes tsx src/content/legal/legal.test.ts

      # Repository variables (Settings → Secrets and variables → Actions → Variables); each one is optional.
      - name: Build site
        run: npx --yes tsx scripts/build-site.ts
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          APP_URL: ${{ vars.APP_URL }}
          APP_STORE_URL: ${{ vars.APP_STORE_URL }}
          PLAY_STORE_URL: ${{ vars.PLAY_STORE_URL }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
